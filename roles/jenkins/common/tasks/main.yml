- name: Update apt cache
  apt:
    update_cache: true
  become: true

- name: Install common packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - unzip
    state: present
  become: true

- name: Ensure Jenkins user exists on every Jenkins node
  user:
    name: jenkins
    home: /home/jenkins
    shell: /bin/bash
    create_home: true
    state: present
  become: true
