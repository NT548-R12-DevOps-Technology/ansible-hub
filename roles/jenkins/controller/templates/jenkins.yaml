jenkins:
  systemMessage: "Jenkins cluster provisioned by Ansible + JCasC (AWS staging)"

  # Controller does not run jobs
  numExecutors: 0

  nodes:
    - permanent:
        name: "jenkins-worker"
        nodeDescription: "CI worker provisioned via Ansible + JCasC"
        labelString: "docker ci linux"
        remoteFS: "/home/jenkins/jenkins-agent"
        numExecutors: 2
        launcher:
          ssh:
            host: "{{ jenkins_worker_host }}"
            port: {{ jenkins_worker_port }}
            credentialsId: "jenkins-worker-ssh"
            launchTimeoutSeconds: 60
            sshHostKeyVerificationStrategy:
              nonVerifyingKeyVerificationStrategy: {}

# =====================================================
# Credentials (managed fully by JCasC)
# DO NOT create or modify manually via Jenkins UI
# =====================================================
credentials:
  system:
    domainCredentials:
      - credentials:

          # 1. SSH private key for connecting Jenkins controller to worker nodes
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "jenkins-worker-ssh"
              username: "jenkins"
              privateKeySource:
                directEntry:
                  privateKey: |
                    {{ jenkins_worker_private_key | indent(20) }}

          # 2. GitHub Personal Access Token (used for CI pipelines)
{% if github_user | length > 0 and github_token | length > 0 %}
          - usernamePassword:
              scope: GLOBAL
              id: "github-token"
              username: "{{ github_user }}"
              password: "{{ github_token }}"
              description: "GitHub PAT for Jenkins CI"
{% endif %}

          # 3. DockerHub credentials (used for building and pushing images)
{% if dockerhub_user | length > 0 and dockerhub_token | length > 0 %}
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-cred"
              username: "{{ dockerhub_user }}"
              password: "{{ dockerhub_token }}"
              description: "DockerHub Credentials for pushing images"
{% endif %}

          # 4. Snyk token injected into security scan stages
{% if snyk_token | length > 0 %}
          - string:
              scope: GLOBAL
              id: "snyk-token"
              secret: {{ snyk_token | to_json }}
              description: "Snyk token for Jenkins security scans"
{% endif %}

          # 5. SonarQube token injected into code analysis stages
{% if sonarqube_token | length > 0 %}
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              secret: {{ sonarqube_token | to_json }}
              description: "SonarQube global analysis token for Jenkins"
{% endif %}


          # 6. Telegram Bot credentials used to deliver Trivy reports
{% if trivy_telegram_bot_token | length > 0 and trivy_telegram_chat_id | string | length > 0 %}
          - string:
              scope: GLOBAL
              id: "trivy-telegram-bot-token"
              secret: {{ trivy_telegram_bot_token | to_json }}
              description: "Telegram bot token for Trivy reports"
          - string:
              scope: GLOBAL
              id: "trivy-telegram-chat-id"
              secret: {{ trivy_telegram_chat_id | string | to_json }}
              description: "Telegram destination chat ID for Trivy reports"
{% endif %}

          # 7. Telegram Bot credentials used to deliver Snyk reports
{% if snyk_telegram_bot_token | length > 0 and snyk_telegram_chat_id | string | length > 0 %}
          - string:
              scope: GLOBAL
              id: "snyk-telegram-bot-token"
              secret: {{ snyk_telegram_bot_token | to_json }}
              description: "Telegram bot token for Snyk reports"
          - string:
              scope: GLOBAL
              id: "snyk-telegram-chat-id"
              secret: {{ snyk_telegram_chat_id | string | to_json }}
              description: "Telegram destination chat ID for Snyk reports"
{% endif %}
