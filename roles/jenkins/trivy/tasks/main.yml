---
# =========================
# Install Trivy (DevSecOps)
# =========================

- name: Install dependencies for Trivy
  apt:
    name:
      - wget
      - apt-transport-https
      - gnupg
      - lsb-release
    state: present
  become: true

- name: Add Trivy GPG key
  apt_key:
    url: https://aquasecurity.github.io/trivy-repo/deb/public.key
    state: present
  become: true

- name: Add Trivy repository
  apt_repository:
    repo: "deb https://aquasecurity.github.io/trivy-repo/deb {{ ansible_distribution_release }} main"
    state: present
  become: true

- name: Install Trivy
  apt:
    name: trivy
    state: present
    update_cache: true
  become: true

- name: Verify Trivy installation
  command: trivy --version
  register: trivy_version
  changed_when: false

- name: Show Trivy version
  debug:
    msg: "Trivy version installed: {{ trivy_version.stdout }}"